<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connect 4</title>
<link rel="stylesheet" href="https://usions.com/usion-design-system.css">
<link rel="stylesheet" href="style.css?v=11">
</head>

<body>

<div class="phone">

  <div class="topbar">

    <div class="player left" id="player1Panel">
      <img id="player1Avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=red">
      <div class="name" id="player1Name">Red</div>
      <div class="wins" id="player1Wins">Wins: <span>0</span></div>
    </div>

    <div class="vs">VS</div>

    <div class="player right" id="player2Panel">
      <img id="player2Avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=yellow">
      <div class="name" id="player2Name">Yellow</div>
      <div class="wins" id="player2Wins">Wins: <span>0</span></div>
    </div>

  </div>

  <div class="turnIndicator" id="status">Your Turn</div>

  <div id="board"></div>

  <!-- Winner Banner (non-blocking, shows below board until rematch / exit) -->
  <div id="winnerBanner" class="winner-banner" hidden>
    <span class="winner-banner-emoji" id="winnerEmoji">🏆</span>
    <span class="winner-banner-text"><strong id="winnerNameDisplay">Red</strong> wins!</span>
    <div class="winner-banner-actions">
      <button class="winner-btn" id="winnerPlayAgain">Rematch</button>
    </div>
  </div>

  <div class="controls">

    <select id="difficulty">
      <option value="1">Easy</option>
      <option value="3">Medium</option>
      <option value="5">Hard</option>
    </select>

  </div>

</div>

<!-- Waiting Overlay -->
<div id="waitingOverlay" class="waiting-overlay">
  <div class="waiting-card">
    <div class="waiting-spinner"></div>
    <p class="waiting-text">Waiting for opponent…</p>
    <button class="waiting-invite-btn hidden" id="inviteBtn">Invite a friend</button>
    <button class="waiting-bot-btn" id="playBotBtn">Play vs Bot instead</button>
  </div>
</div>

<script src="https://usions.com/usion-sdk.js"></script>
<script src="script.js?v=15"></script>

</body>
</html>
